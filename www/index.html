<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0f0f" />
    <title>Peckers</title>
    <!--
      Remote mode ignores this directory's contents — the WebView loads
      server.url instead. This page exists because webDir must exist or
      `cap sync` fails, and it is what shows if the WebView ever falls back
      to the bundled assets. It must stay free of any business logic.
    -->
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        background: #0f0f0f;
        color: #f4f4f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        min-height: 100vh;
        text-align: center;
      }
      main {
        max-width: 22rem;
      }
      h1 {
        font-size: 1.375rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0 0 0.625rem;
      }
      p {
        font-size: 0.9375rem;
        line-height: 1.55;
        color: #a1a1aa;
        margin: 0 0 1.5rem;
      }
      .mark {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: #1c1c1f;
        border: 1px solid #2a2a2e;
        margin: 0 auto 1.25rem;
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 1.5rem;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 10px;
        background: #f4f4f5;
        color: #0f0f0f;
        font: inherit;
        font-weight: 600;
        padding: 0.75rem 1.5rem;
        cursor: pointer;
      }
      button:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">P</div>
      <h1>No connection</h1>
      <p>
        Peckers needs an internet connection to load. Check your Wi-Fi or mobile
        data, then try again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
